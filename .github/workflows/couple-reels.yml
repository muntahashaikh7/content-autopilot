name: Couple Reels autopilot

on:
  schedule:
    - cron: "0 0 * * *"   # 05:00 PKT daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  couple:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trend watch (free sources)
        run: python3 scripts/couple.py
      - name: Commit daily brief
        run: |
          git config user.name "mjs-autopilot"
          git config user.email "mjs-autopilot@users.noreply.github.com"
          git add daily state/couple.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Couple brief $(date -u +%F): $(python3 -c "import json,datetime;print(json.load(open('daily/'+datetime.date.today().isoformat()+'/couple-brief.json'))['trope'])")"
          git pull --rebase origin main || true
          git push || (sleep 15 && git pull --rebase origin main && git push)
